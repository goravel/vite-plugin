name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm stage publish --dry-run instead of staging a release
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4.3.0

      # No registry-url on purpose: setup-node would write
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}, which has no value
      # under OIDC and can break the token exchange. npm defaults to npmjs.org.
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24

      # Node 24.14 ships npm 11.11.0. Staged publishing needs 11.15.0, --json on
      # `npm stage publish` arrived with it, and --tag under OIDC needs 11.21.0,
      # so install the newest 12.2 CLI, which clears all three floors; a range
      # keeps a surprise major out of a release.
      - name: Use an npm that supports staged publishing
        run: |
          npm install --global 'npm@^12.2.0'
          node --version
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json would stage a version nobody
      # asked for: pluginVersion() ships package.json's version to the banner.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match v$version in package.json"
            exit 1
          fi

      - name: Work out the dist-tag
        run: |
          version=$(node -p "require('./package.json').version")
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DIST_TAG=$tag" >> "$GITHUB_ENV"

      # Its own step: tsc has to leave dist/ behind before either path packs, and
      # staging with --ignore-scripts then skips prepublishOnly.
      - name: Build and test
        run: npm test

      # --ignore-scripts because a lifecycle script inherits stdout, so its log
      # would land in stage.json ahead of npm's JSON and break the parse; `npm test`
      # above has already built and tested this commit.
      # Staging skips the 2FA prompt and leaves the approval to a maintainer, so
      # OIDC alone is enough here. --json is the only way to learn the stage id in
      # CI: `npm stage list` needs interactive auth and cannot use an OIDC token.
      - name: Stage the release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        run: |
          npm stage publish --tag "$DIST_TAG" --json --ignore-scripts > stage.json || { cat stage.json; exit 1; }
          cat stage.json
          stage_id=$(node -p "Object.values(require('./stage.json'))[0].stageId || ''" || echo '')
          if [ -z "$stage_id" ]; then
            echo "::error::npm stage publish returned no stage id; approve by hand on npmjs.com → Staged Packages"
            exit 1
          fi
          {
            echo "### Staged goravel-vite-plugin@$VERSION"
            echo
            echo "Dist-tag: \`$DIST_TAG\`. Nothing is installable until a maintainer approves it with 2FA:"
            echo
            echo '```'
            echo "npm stage approve $stage_id"
            echo '```'
            echo
            echo "To rebuild instead: \`npm stage reject $stage_id\`, fix, and push the tag again."
          } >> "$GITHUB_STEP_SUMMARY"

      # No credentials and no upload: dry-run only packs. It needs no token, and
      # dist/ is already built, so --ignore-scripts only keeps the output readable.
      - name: Stage the release (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm stage publish --dry-run --tag "$DIST_TAG" --ignore-scripts
